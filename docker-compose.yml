name: ile-iwe
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ile_iwe}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-password}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  backend:
    build: .
    env_file: .env
    environment: &backend_env
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-local-postgres-password}@db:5432/${POSTGRES_DB:-ile_iwe}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-development-only-replace-with-a-long-random-secret}
      FRONTEND_URL: ${FRONTEND_URL:-http://127.0.0.1:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5173}
      LOCAL_STORAGE_PATH: /app/storage
      AUTO_MIGRATE: "true"
      PORT: "8000"
    ports: ["${PORT:-8000}:8000"]
    volumes: ["documents:/app/storage"]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "app.worker"]
    environment: *backend_env
    volumes: ["documents:/app/storage"]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
volumes:
  postgres_data:
  documents:
